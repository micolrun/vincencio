name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run API and pipeline tests
        run: python -m pytest -q

      - name: Validate Remotion composition
        run: npm exec remotion compositions remotion/index.ts

      - name: Render smoke-test video
        run: npm run render

      - name: Upload smoke-test video
        uses: actions/upload-artifact@v4
        with:
          name: remotion-smoke-test
          path: renders/output.mp4
          if-no-files-found: error
          retention-days: 7

