name: Deploy GitHub Pages app

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "firebase-auth.js"
      - "styles.css"
      - "homepage.css"
      - "manifest.webmanifest"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble public site
        shell: bash
        run: |
          mkdir -p _site/site
          cp index.html app.js firebase-auth.js styles.css homepage.css manifest.webmanifest .nojekyll _site/
          cp site/styles.css _site/site/styles.css
      - name: Upload static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
