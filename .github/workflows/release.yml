name: Release Windows package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: python -m pytest -q
      - run: npm exec remotion compositions remotion/index.ts

      - name: Assemble release directory
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/VincentioStudio/* -DestinationPath dist/VincentioStudio-${{ github.ref_name }}-windows.zip
          (Get-FileHash dist/VincentioStudio-${{ github.ref_name }}-windows.zip -Algorithm SHA256).Hash | Set-Content dist/VincentioStudio-${{ github.ref_name }}-windows.zip.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VincentioStudio-${{ github.ref_name }}-windows
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256

